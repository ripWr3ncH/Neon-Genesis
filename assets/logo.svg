<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220" viewBox="0 0 220 220" role="img" aria-label="Neon Genesis logo">
  <title>Neon Genesis</title>
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3d8b"/>
      <stop offset="0.5" stop-color="#b44dff"/>
      <stop offset="1" stop-color="#3ff0ff"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14061f"/>
      <stop offset="0.7" stop-color="#3a0f3d"/>
      <stop offset="1" stop-color="#5a1a3a"/>
    </linearGradient>
    <linearGradient id="towers" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1030"/>
      <stop offset="1" stop-color="#0b0716"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff3d8b" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3ff0ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="diamond">
      <polygon points="110,18 202,110 110,202 18,110"/>
    </clipPath>
  </defs>

  <!-- inside of the diamond: night sky, moon, skyline, water -->
  <g clip-path="url(#diamond)">
    <rect x="0" y="0" width="220" height="220" fill="url(#sky)"/>
    <path d="M150 58 a14 14 0 1 0 10 24 a11 11 0 1 1 -10 -24z" fill="#f2e8ff" opacity="0.92"/>
    <!-- skyline -->
    <g fill="url(#towers)" stroke="#2a1a45" stroke-width="0.6">
      <rect x="42" y="96" width="18" height="40"/>
      <rect x="60" y="76" width="16" height="60"/>
      <rect x="78" y="58" width="20" height="78"/>
      <polygon points="88,40 92,58 84,58"/>
      <rect x="100" y="86" width="14" height="50"/>
      <rect x="116" y="66" width="18" height="70"/>
      <rect x="136" y="92" width="16" height="44"/>
      <rect x="154" y="80" width="18" height="56"/>
    </g>
    <!-- lit windows -->
    <g fill="#ffd27a">
      <rect x="64" y="84" width="3" height="4"/><rect x="70" y="96" width="3" height="4"/>
      <rect x="82" y="68" width="3" height="4"/><rect x="90" y="80" width="3" height="4"/><rect x="82" y="104" width="3" height="4"/>
      <rect x="120" y="76" width="3" height="4"/><rect x="127" y="92" width="3" height="4"/>
      <rect x="158" y="90" width="3" height="4"/><rect x="165" y="108" width="3" height="4"/>
    </g>
    <g fill="#7af4ff">
      <rect x="46" y="104" width="3" height="4"/><rect x="90" y="96" width="3" height="4"/>
      <rect x="104" y="96" width="3" height="4"/><rect x="120" y="104" width="3" height="4"/>
      <rect x="140" y="100" width="3" height="4"/>
    </g>
    <!-- neon strips on the towers -->
    <g filter="url(#glow)" stroke-linecap="round">
      <line x1="80" y1="62" x2="80" y2="128" stroke="#ff3d8b" stroke-width="2.2"/>
      <line x1="118" y1="70" x2="132" y2="70" stroke="#3ff0ff" stroke-width="2.2"/>
      <line x1="154" y1="84" x2="172" y2="84" stroke="#b44dff" stroke-width="2.2"/>
      <line x1="62" y1="80" x2="62" y2="120" stroke="#3ff0ff" stroke-width="2"/>
    </g>
    <!-- ground line and wet-street reflection -->
    <rect x="0" y="136" width="220" height="84" fill="#0a0612"/>
    <g opacity="0.55" transform="translate(0,272) scale(1,-1)">
      <rect x="42" y="96" width="18" height="40" fill="url(#water)"/>
      <rect x="60" y="76" width="16" height="60" fill="url(#water)"/>
      <rect x="78" y="58" width="20" height="78" fill="url(#water)"/>
      <rect x="100" y="86" width="14" height="50" fill="url(#water)"/>
      <rect x="116" y="66" width="18" height="70" fill="url(#water)"/>
      <rect x="136" y="92" width="16" height="44" fill="url(#water)"/>
      <rect x="154" y="80" width="18" height="56" fill="url(#water)"/>
    </g>
    <line x1="20" y1="136" x2="200" y2="136" stroke="#ff3d8b" stroke-width="1.6" filter="url(#glow)"/>
    <!-- rain -->
    <g stroke="#cfe9ff" stroke-width="0.8" opacity="0.45">
      <line x1="56" y1="44" x2="53" y2="56"/><line x1="104" y1="30" x2="101" y2="42"/>
      <line x1="136" y1="40" x2="133" y2="52"/><line x1="170" y1="62" x2="167" y2="74"/>
      <line x1="70" y1="150" x2="67" y2="162"/><line x1="146" y1="152" x2="143" y2="164"/>
    </g>
  </g>

  <!-- neon diamond frame -->
  <polygon points="110,18 202,110 110,202 18,110" fill="none" stroke="url(#frame)" stroke-width="6" filter="url(#glow)"/>
  <polygon points="110,30 190,110 110,190 30,110" fill="none" stroke="url(#frame)" stroke-width="1.2" opacity="0.6"/>
  <!-- HUD corner ticks -->
  <g stroke="#3ff0ff" stroke-width="2" opacity="0.8">
    <line x1="110" y1="6" x2="110" y2="13"/><line x1="110" y1="207" x2="110" y2="214"/>
    <line x1="6" y1="110" x2="13" y2="110"/><line x1="207" y1="110" x2="214" y2="110"/>
  </g>
</svg>
